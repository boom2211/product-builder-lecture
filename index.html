<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>행운의 로또 번호 추천</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>

<body>
  <div class="container">
    <div class="logo">LUCKY LOTTO</div>

    <h1>오늘의 행운 번호</h1>

    <p class="subtitle">
      당신의 행운을 위한 로또 번호를 추천해 드립니다.<br>
      버튼을 눌러 새로운 번호를 확인해 보세요!
    </p>

    <div class="lotto-balls" id="lottoBalls">
      <div class="empty-message">아래 버튼을 눌러주세요!</div>
    </div>

    <button class="recommend-btn" onclick="generateLotto()">
      ✨ 로또 번호 추천받기
    </button>

    <button class="recommend-btn sub-btn" onclick="generateMultiple()">
      5개 조합 한 번에 추천받기
    </button>

    <div class="history" id="history">
      <h3>최근 추천 번호</h3>
      <div id="historyList">
        <p style="font-size:13px;color:#bbb;">아직 추천 기록이 없습니다.</p>
      </div>
    </div>

    <p class="notice">
      ※ 본 서비스는 무작위 번호 추천 서비스입니다.<br>
      당첨을 보장하지 않으며, 로또 구매는 신중하게 해주세요.
    </p>
  </div>
</body>
</html>
