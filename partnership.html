<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>제휴 문의</title>
  <style>
    :root {
      --bg: #f4f6fb; --card: #fff; --text: #1f2430; --muted: #6b7280;
      --border: #d9dde7; --primary: #5b6cff; --primary-text: #fff;
      --ok: #16a34a; --err: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161d; --card: #1e212b; --text: #e8eaf0; --muted: #9aa0b0;
        --border: #343846; --primary: #7482ff; --primary-text: #fff;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    }
    .card {
      width: 100%; max-width: 480px; background: var(--card);
      border: 1px solid var(--border); border-radius: 16px; padding: 28px;
    }
    h1 { margin: 0 0 6px; font-size: 22px; }
    p.desc { margin: 0 0 22px; color: var(--muted); font-size: 14px; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; font-weight: 600; }
    input, textarea {
      width: 100%; padding: 11px 12px; font: inherit; font-size: 15px;
      color: var(--text); background: transparent;
      border: 1px solid var(--border); border-radius: 10px;
    }
    input:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
    textarea { min-height: 130px; resize: vertical; }
    button {
      width: 100%; margin-top: 20px; padding: 13px; font: inherit; font-size: 16px; font-weight: 600;
      color: var(--primary-text); background: var(--primary);
      border: 0; border-radius: 10px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #status { margin-top: 14px; font-size: 14px; min-height: 20px; }
    #status.ok { color: var(--ok); }
    #status.err { color: var(--err); }
    .hp { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>제휴 문의</h1>
    <p class="desc">제휴·협업 제안을 남겨 주세요. 확인 후 입력하신 이메일로 답변드릴게요.</p>

    <form id="form" action="https://formspree.io/f/xvkawppo" method="POST">
      <label for="name">이름 / 회사명</label>
      <input id="name" name="name" type="text" required autocomplete="organization">

      <label for="email">이메일</label>
      <input id="email" name="email" type="email" required autocomplete="email">

      <label for="subject">제목</label>
      <input id="subject" name="subject" type="text" required>

      <label for="message">문의 내용</label>
      <textarea id="message" name="message" required></textarea>

      <!-- 스팸 방지용 숨김 필드 -->
      <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button id="submit" type="submit">문의 보내기</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const form = document.getElementById('form');
    const btn = document.getElementById('submit');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      status.className = '';
      status.textContent = '보내는 중...';
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { Accept: 'application/json' }
        });
        if (res.ok) {
          form.reset();
          status.className = 'ok';
          status.textContent = '문의가 접수되었어요. 감사합니다!';
        } else {
          throw new Error();
        }
      } catch {
        status.className = 'err';
        status.textContent = '전송에 실패했어요. 잠시 후 다시 시도해 주세요.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
